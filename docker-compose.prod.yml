services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      MALLOC_ARENA_MAX: "2"
      DATABASE_PATH: /data/height_work_agent.sqlite
      UPLOAD_DIR: /data/uploads
      CHROMA_DIR: /data/chroma
      AUDIT_CONCURRENCY: "2"
    volumes:
      - ./runtime:/data
    expose:
      - "8000"
    init: true
    stop_grace_period: 30s
    mem_limit: 1500m
    mem_reservation: 768m
    cpus: 1.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy-locations.conf:/etc/nginx/conf.d/proxy-locations.inc:ro
      - ./deploy/access-control.off.conf:/etc/nginx/conf.d/access-control.inc:ro
    mem_limit: 96m
    cpus: 0.2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
