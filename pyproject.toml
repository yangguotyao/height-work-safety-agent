[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "height-work-safety-agent"
version = "0.1.0"
description = "高处作业施工方案风险专项审计后端"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.25,<2",
  "chromadb>=1.1,<2",
  "openai>=1.55,<3",
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "mcp>=1.26,<3",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
